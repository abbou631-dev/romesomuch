# After a push to main that changes an article or an experience, tell Bing and the
# other IndexNow engines which pages to recrawl (see scripts/indexnow.mjs).
# Journal PRs merged by journal-pr.yml do not trigger this (a merge made with the
# workflow token starts no new workflow), so that workflow calls the script itself.
name: IndexNow

on:
  push:
    branches: [main]
    paths: ["src/content/**"]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git diff --name-only "$BEFORE" "$AFTER" | node scripts/indexnow.mjs
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
